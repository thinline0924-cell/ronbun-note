<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論文ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="メインメニュー">
    <div class="brand">論文ノート</div>
    <button class="nav" data-view="home">ホーム</button>
    <button class="nav" data-view="materials">研究資料</button>
    <button class="nav" data-view="logs">研究ログ</button>
    <button class="nav" data-view="paper">論文</button>
    <button class="nav" data-view="deadlines">締切</button>
    <button class="nav" data-view="settings">設定</button>
    <p class="side-note">データはこのブラウザの中だけに保存されます</p>
  </nav>

  <main class="main">
    <header class="top">
      <div class="top-title">
        <div class="top-kind" id="top-kind"></div>
        <h1 id="top-title"></h1>
      </div>
      <div class="top-actions">
        <form class="search" id="search-form" role="search">
          <label for="search">検索</label>
          <input id="search" type="search" placeholder="資料・ログ・論文を検索">
        </form>
        <button class="btn btn-yellow" data-action="pick-files">＋ 資料を追加</button>
      </div>
    </header>
    <div class="busy" id="busy" hidden></div>
    <section id="view" aria-live="polite"></section>
  </main>
</div>

<input type="file" id="file-input" multiple hidden>
<input type="file" id="backup-input" accept=".json,application/json" hidden>

<div class="toast" id="toast" role="status" hidden></div>

<div class="dialog-back" id="dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-text">
    <p id="dialog-text"></p>
    <div class="dialog-buttons">
      <button class="btn btn-plain" id="dialog-no">やめる</button>
      <button class="btn btn-danger" id="dialog-yes">はい</button>
    </div>
  </div>
</div>

<!-- PDF で保存するとき(印刷)だけ表示する -->
<article id="print-paper" class="paper print-only"></article>

<script type="module" src="/app.js"></script>
</body>
</html>
